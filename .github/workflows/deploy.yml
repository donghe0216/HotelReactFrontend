name: Deploy to AWS

# ─────────────────────────────────────────────────────────────────────────────
# Triggered automatically when the "E2E Tests" workflow completes successfully
# on master.  Only the successful branch fires the deployment.
# ─────────────────────────────────────────────────────────────────────────────
on:
  workflow_run:
    workflows: ["E2E Tests"]
    types: [completed]
    branches: [master]

# ─────────────────────────────────────────────────────────────────────────────
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#
#   AWS_ACCESS_KEY_ID        IAM user / role access key
#   AWS_SECRET_ACCESS_KEY    IAM user / role secret
#   CF_DIST_ID               CloudFront distribution ID  (terraform output main_cloudfront_distribution_id)
#   S3_BUCKET                Frontend S3 bucket name     (terraform output frontend_s3_bucket)
#   ARTIFACTS_BUCKET         Artifact S3 bucket name     (terraform output artifacts_bucket)
#   EC2_INSTANCE_ID          EC2 instance ID             (terraform output webapp_ec2_instance_id)
#
# ─────────────────────────────────────────────────────────────────────────────

env:
  AWS_REGION: ap-northeast-1

jobs:

  # ── Guard: only run when E2E passed ────────────────────────────────────────
  check:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - run: echo "E2E passed — proceeding with deployment"

  # ── Frontend: build React SPA → S3 → CloudFront invalidation ───────────────
  deploy-frontend:
    needs: check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        # CI=false prevents CRA from treating ESLint warnings as errors.
        # TODO: resolve ESLint warnings and remove this flag.
        run: CI=false npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Sync build to S3
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          # Static assets (JS/CSS/images) use content-hash filenames (CRA default)
          # — safe to cache permanently since any change produces a new filename.
          aws s3 sync build/ s3://${S3_BUCKET} \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html"

          # index.html has no hash and is the SPA entry point — must never be
          # cached, otherwise users get stale JS/CSS references after a deploy.
          aws s3 cp build/index.html s3://${S3_BUCKET}/index.html \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CF_DIST_ID }} \
            --paths "/*"

  # ── Backend: Maven build → JAR upload to S3 → deploy to EC2 via SSM ─────────
  deploy-backend:
    needs: check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/HotelBookingBackend

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR
        run: mvn package -DskipTests --no-transfer-progress

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Upload JAR to S3
        run: |
          aws s3 cp target/HotelBooking-0.0.1-SNAPSHOT.jar \
            s3://${{ secrets.ARTIFACTS_BUCKET }}/app.jar

      - name: Deploy to EC2 via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "aws s3 cp s3://${{ secrets.ARTIFACTS_BUCKET }}/app.jar /opt/hotel/app.jar",
              "systemctl restart hotel"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: ${COMMAND_ID}"

          # Wait for command to complete (max 5 min)
          aws ssm wait command-executed \
            --command-id "${COMMAND_ID}" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}"

          STATUS=$(aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query "Status" --output text)

          echo "Deployment status: ${STATUS}"
          [ "$STATUS" = "Success" ] || exit 1
