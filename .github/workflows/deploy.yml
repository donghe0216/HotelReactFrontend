name: Deploy to AWS

# ─────────────────────────────────────────────────────────────────────────────
# Triggered automatically when the "E2E Tests" workflow completes successfully
# on master.  Only the successful branch fires the deployment.
# ─────────────────────────────────────────────────────────────────────────────
on:
  workflow_run:
    workflows: ["E2E Tests"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

# ─────────────────────────────────────────────────────────────────────────────
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#
#   AWS_ROLE_ARN   IAM role ARN for OIDC  (terraform output github_actions_role_arn)
#   CF_DIST_ID     CloudFront distribution ID  (terraform output main_cloudfront_distribution_id)
#   S3_BUCKET      Frontend S3 bucket name     (terraform output frontend_s3_bucket)
#
# ─────────────────────────────────────────────────────────────────────────────

env:
  AWS_REGION: ap-northeast-1

jobs:

  # ── Guard: only run when E2E passed ────────────────────────────────────────
  check:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - run: echo "E2E passed — proceeding with deployment"

  # ── Frontend: build React SPA → S3 → CloudFront invalidation ───────────────
  deploy-frontend:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        # CI=false prevents CRA from treating ESLint warnings as errors.
        # TODO: resolve ESLint warnings and remove this flag.
        run: CI=false npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region:     ${{ env.AWS_REGION }}

      - name: Sync build to S3
        env:
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
        run: |
          # Static assets (JS/CSS/images) use content-hash filenames (CRA default)
          # — safe to cache permanently since any change produces a new filename.
          aws s3 sync build/ s3://${S3_BUCKET} \
            --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html"

          # index.html has no hash and is the SPA entry point — must never be
          # cached, otherwise users get stale JS/CSS references after a deploy.
          aws s3 cp build/index.html s3://${S3_BUCKET}/index.html \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CF_DIST_ID }} \
            --paths "/*"

